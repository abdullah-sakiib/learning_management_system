[pytest]
DJANGO_SETTINGS_MODULE = lms_project.settings
python_files = test_*.py
testpaths = core/tests
addopts = --strict-markers --strict-config
markers =
    unit: isolated form, model, service, selector, or utility test
    integration: Django request/response or database integration test
    selenium: browser-driven end-to-end test
    bva: boundary value analysis test
    equivalence: equivalence-class test
    decision_table: decision-table test
    basis_path: basis-path test
    member_a: Member A account, profile, access, and administration case
    member_b: Member B course, enrollment, content, and communication case
    member_c: Member C assignment, grading, quiz, and reporting case
